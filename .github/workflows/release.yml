name: Release notes & changelog
on:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
      - name: Update release body
        run: gh release edit "${{ github.event.release.tag_name }}" --notes-file "${{ steps.notes.outputs.changelog }}"
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          args: --output CHANGELOG.md
      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs(changelog): 📝 update for ${{ github.event.release.tag_name }}"
          git push
