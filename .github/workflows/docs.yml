name: Build API docs
on:
  push:
    branches: [ master ]
    paths: [ 'src/**', 'documentation/**', '.github/workflows/docs.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Doctum docs
        uses: sudo-bot/action-doctum@v5
        with:
          config-file: documentation/doctum.config.php
          method: update
          cli-args: --output-format=github --no-ansi --no-progress -v
      - name: Set custom domain
        run: echo flarum-sso-php.api.docs.maicol07.it | sudo tee docs/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
